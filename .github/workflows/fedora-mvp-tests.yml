name: Fedora MVP tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - name: Install Fedora dependencies
        run: dnf install -y git nodejs python3 python3-gobject python3-cairo cairo-gobject gobject-introspection gtk4 libadwaita
      - uses: actions/checkout@v4
      - name: Run isolated regression suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -q
      - name: Verify isolated JS SDK event relay
        run: node bridge/sdk_event_bridge.test.mjs && node bridge/sdk_event_iterator.test.mjs && node bridge/sdk_event_ipc.test.mjs
      - name: Check Python syntax
        run: python3 -m compileall -q src scripts tests
